<!DOCTYPE html>
<!-- variants: forest, midnight -->
<html lang="en" data-theme="auto" data-palette="@@PALETTE@@">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product growth flywheel</title>
  <style>
/* @@THEMES@@ */
/* @@BASE@@ */
/* @@MOTION@@ */
    .loop-center { fill: var(--ink); font-family: var(--font-title); font-size: 22px; }
    .loop-note { fill: var(--muted); font-family: var(--font-tech); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Loop · Growth</p>
    <h1>Product growth flywheel</h1>
    <p class="lede">Four stages feed each other. Retention is the load-bearing stage: the dashes move clockwise and stop as a solid loop when motion is reduced.</p>

    <div class="diagram-container">
      <svg class="diagram" data-slug="cycle" data-animate="flow"
           viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg"
           role="img" aria-labelledby="cycle-title cycle-desc">
        <title id="cycle-title">Product growth flywheel</title>
        <desc id="cycle-desc">Attract feeds activate, activate feeds retain, retain feeds refer, and refer feeds attract; retention is the focal stage.</desc>

        <defs>
          <marker id="cycle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon class="marker-muted" points="0 0, 8 3, 0 6"/>
          </marker>
        </defs>

        <rect class="diagram-bg" width="960" height="600"/>

        <path class="edge" data-flow="true" d="M 560,96 H 732 Q 740,96 740,104 V 268" marker-end="url(#cycle-arrow)"/>
        <path class="edge" data-flow="true" d="M 740,332 V 400 Q 740,408 732,408 H 568 Q 560,408 560,416 V 472" marker-end="url(#cycle-arrow)"/>
        <path class="edge" data-flow="true" d="M 400,504 H 256 Q 248,504 248,496 V 388 Q 248,380 240,380 H 224 Q 216,380 216,372 V 332" marker-end="url(#cycle-arrow)"/>
        <path class="edge" data-flow="true" d="M 216,268 V 196 Q 216,188 224,188 H 392 Q 400,188 400,180 V 128" marker-end="url(#cycle-arrow)"/>

        <g class="edge-label-group">
          <rect class="label-mask" x="620" y="80" width="56" height="12" rx="2"/>
          <text class="edge-label" x="628" y="89">PUBLISH</text>
        </g>
        <g class="edge-label-group">
          <rect class="label-mask" x="744" y="356" width="56" height="12" rx="2"/>
          <text class="edge-label" x="752" y="365">ONBOARD</text>
        </g>
        <g class="edge-label-group">
          <rect class="label-mask" x="304" y="488" width="48" height="12" rx="2"/>
          <text class="edge-label" x="312" y="497">HABIT</text>
        </g>
        <g class="edge-label-group">
          <rect class="label-mask" x="272" y="172" width="48" height="12" rx="2"/>
          <text class="edge-label" x="280" y="181">INVITE</text>
        </g>

        <g class="node" data-node="attract">
          <rect class="node-mask" x="400" y="64" width="160" height="64" rx="6"/>
          <rect class="node-box node-box--backend" x="400" y="64" width="160" height="64" rx="6"/>
          <text class="node-tag" x="412" y="82">STAGE 1</text>
          <text class="node-name" x="480" y="102" text-anchor="middle">Attract</text>
          <text class="node-tech" x="480" y="118" text-anchor="middle">content · SEO</text>
        </g>

        <g class="node" data-node="activate">
          <rect class="node-mask" x="656" y="268" width="160" height="64" rx="6"/>
          <rect class="node-box node-box--backend" x="656" y="268" width="160" height="64" rx="6"/>
          <text class="node-tag" x="668" y="286">STAGE 2</text>
          <text class="node-name" x="736" y="306" text-anchor="middle">Activate</text>
          <text class="node-tech" x="736" y="322" text-anchor="middle">first value</text>
        </g>

        <g class="node" data-node="retain">
          <rect class="node-mask" x="400" y="472" width="160" height="64" rx="6"/>
          <rect class="node-box node-box--focal" x="400" y="472" width="160" height="64" rx="6"/>
          <text class="node-tag" x="412" y="490">BOTTLENECK</text>
          <text class="node-name" x="480" y="510" text-anchor="middle">Retain</text>
          <text class="node-tech" x="480" y="526" text-anchor="middle">habit · weekly</text>
        </g>

        <g class="node" data-node="refer">
          <rect class="node-mask" x="144" y="268" width="160" height="64" rx="6"/>
          <rect class="node-box node-box--backend" x="144" y="268" width="160" height="64" rx="6"/>
          <text class="node-tag" x="156" y="286">STAGE 4</text>
          <text class="node-name" x="224" y="306" text-anchor="middle">Refer</text>
          <text class="node-tech" x="224" y="322" text-anchor="middle">invite · share</text>
        </g>

        <text class="loop-center" x="480" y="292" text-anchor="middle">Product</text>
        <text class="loop-center" x="480" y="316" text-anchor="middle">flywheel</text>
        <text class="loop-note" x="480" y="340" text-anchor="middle">COMPOUNDING LOOP</text>

        <text class="annotation" x="64" y="576">Retention is the bottleneck: faster acquisition only amplifies a leaky loop.</text>
      </svg>
    </div>
  </div>
</body>
</html>
